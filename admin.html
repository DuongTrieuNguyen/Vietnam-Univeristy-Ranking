<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Quản Trị - Xếp Hạng Đại Học</title>
<style>
body { background-color: #fcf8f5; color: #4a3b32; font-family: Cambria; padding: 40px; max-width: 900px; margin: auto; }
.card { background-color: #f4ece6; padding: 25px; border-radius: 12px; border: 1px solid #e3d5cb; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
.logo-me { width: 180px; height: 130px; object-fit: contain; vertical-align: middle; margin-right: 15px; }

/* Bảng màu Badge điểm số */
.badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; color: #ffffff; font-size: 0.9em; }
.badge-red { background-color: #d9534f; }
.badge-dark-yellow { background-color: #d97706; }
.badge-light-yellow { background-color: #ca8a04; }
.badge-light-green { background-color: #06b6d4; }
.badge-green { background-color: #22c55e; }
.badge-dark-green { background-color: #15803d; }

/* Thanh tiến độ */
.progress-bar-bg { background-color: #e3d5cb; border-radius: 8px; height: 10px; width: 100%; margin-top: 5px; margin-bottom: 15px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 8px; }

/* Form nhập liệu Tool */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #5c4033; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #e3d5cb; background-color: #fffcf9; font-family: Cambria; box-sizing: border-box; }
.btn { background-color: #6b4f3f; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: Cambria; font-size: 1em; }
.btn:hover { background-color: #553d31; }
.back-link { display: inline-block; margin-bottom: 20px; color: #6b4f3f; text-decoration: none; font-weight: bold; }

/* Mặc định ẩn bảng quản trị đi chờ nhập mật khẩu */
#adminPanel { display: none; }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Quay lại Trang Chủ</a>

<!-- KHUNG ĐĂNG NHẬP MẬT KHẨU -->
<div class="card" id="loginBox">
    <h3>🔐 Đăng Nhập Quyền Quản Trị</h3>
    <div class="form-group">
        <label>Nhập mật khẩu Admin:</label>
        <input type="password" id="adminPass" placeholder="Mật khẩu mặc định: admin123">
    </div>
    <button class="btn" onclick="checkLogin()">Xác Nhận</button>
</div>

<!-- KHUNG QUẢN TRỊ CHÍNH -->
<div id="adminPanel">
    <div class="card" style="border: 2px dashed #b08d79;">
        <h3>Công Cụ Tạo & Lưu Trường Đại Học Lên Mây</h3>
        <p style="font-size: 0.9em; margin-bottom: 15px;">Điền thông tin và các điểm số tiêu chí bên dưới để hệ thống đồng bộ trực tiếp lên hệ thống.</p>
        
        <div class="form-group">
            <label>Tên Trường Đại Học:</label>
            <input type="text" id="inputName" value="Đại học Quốc gia Thành phố Hồ Chí Minh">
        </div>
        
        <div class="form-group">
            <label>Link Ảnh Logo Trường (URL):</label>
            <input type="text" id="inputLogo" value="https://upload.wikimedia.org/wikipedia/vi/f/fb/VNUHCM_logo.svg">
        </div>

        <div class="form-group">
            <label>Mô tả ngắn về trường:</label>
            <textarea id="inputDesc" rows="2">Là một trong hai Đại học Quốc gia ở Việt Nam, đóng vai trò quan trọng trong giáo dục bậc cao khu vực miền Nam.</textarea>
        </div>

        <h4 style="margin-top: 20px; color: #5c4033; border-bottom: 1px solid #e3d5cb; padding-bottom: 5px;">Điểm số các Tiêu chí (Theo công thức v6.2)</h4>
        
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>1. Độ phủ Tổng quát (20 điểm):</label><input type="number" id="scorePTQ" value="18" step="0.1"></div>
            <div class="form-group" style="flex: 1;"><label>2. Độ phủ Chi tiết (15 điểm):</label><input type="number" id="scorePCT" value="11.08" step="0.01"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>3. Độ mở với người học (15 điểm):</label><input type="number" id="scoreDMNH" value="1.96" step="0.01"></div>
            <div class="form-group" style="flex: 1;"><label>4. Mức độ thu hút (15 điểm):</label><input type="number" id="scoreMDTH" value="4.24" step="0.01"></div>
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>5. Mức liên kết (25 điểm):</label><input type="number" id="scoreMLK" value="22.3" step="0.01"></div>
            <div class="form-group" style="flex: 1;"><label>6. Điểm thi đua (15 điểm):</label><input type="number" id="scoreTD" value="11.4" step="0.01"></div>
        </div>

        <button class="btn" onclick="addNewUniversity()">💾 Lưu Lên Hệ Thống Mây</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAxo2jhBAk4CfE99PmhHULoa5Rbq9ZKy0",
    authDomain: "vinuniranking.firebaseapp.com",
    projectId: "vinuniranking",
    storageBucket: "vinuniranking.firebasestorage.app",
    messagingSenderId: "514165857266",
    appId: "1:514165857266:web:2cb8ebf84fd6298443e96b",
    measurementId: "G-ZXNG885SR6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.checkLogin = function() {
      let pass = document.getElementById('adminPass').value;
      if(pass === "admin123") {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
      } else {
          alert("Sai mật khẩu rồi sếp ơi!");
      }
  }

  window.addNewUniversity = async function() {
      let name = document.getElementById('inputName').value;
      let logo = document.getElementById('inputLogo').value;
      let desc = document.getElementById('inputDesc').value;
      let ptq = parseFloat(document.getElementById('scorePTQ').value) || 0;
      let pct = parseFloat(document.getElementById('scorePCT').value) || 0;
      let dmnh = parseFloat(document.getElementById('scoreDMNH').value) || 0;
      let mdth = parseFloat(document.getElementById('scoreMDTH').value) || 0;
      let mlk = parseFloat(document.getElementById('scoreMLK').value) || 0;
      let td = parseFloat(document.getElementById('scoreTD').value) || 0;

      if(!name) {
          alert("Vui lòng nhập tên trường!");
          return;
      }

      try {
          await addDoc(collection(db, "universities"), {
              name: name, logo: logo, desc: desc,
              ptq: ptq, pct: pct, dmnh: dmnh,
              mdth: mdth, mlk: mlk, td: td,
              createdAt: new Date()
          });
          alert("Thêm trường lên mây thành công! Mở trang chủ để xem đầy đủ thanh tiến trình.");
          location.reload();
      } catch (e) {
          alert("Lỗi: " + e.message);
      }
  }
</script>

</body>
</html>
