<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Quản Trị - Xếp Hạng Đại Học</title>
<style>
body { background-color: #fcf8f5; color: #4a3b32; font-family: Cambria; padding: 40px; max-width: 900px; margin: auto; }
.card { background-color: #f4ece6; padding: 25px; border-radius: 12px; border: 1px solid #e3d5cb; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
.logo-me { width: 50px; height: 50px; object-fit: contain; vertical-align: middle; margin-right: 15px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #5c4033; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #e3d5cb; background-color: #fffcf9; font-family: Cambria; box-sizing: border-box; }
.btn { background-color: #6b4f3f; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: Cambria; font-size: 1em; }
.btn:hover { background-color: #553d31; }
.btn-danger { background-color: #d9534f; padding: 8px 15px; font-size: 0.9em; }
.btn-danger:hover { background-color: #c9302c; }
.back-link { display: inline-block; margin-bottom: 20px; color: #6b4f3f; text-decoration: none; font-weight: bold; }
#adminPanel { display: none; }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Quay lại Trang Chủ</a>

<!-- KHUNG ĐĂNG NHẬP MẬT KHẨU -->
<div class="card" id="loginBox">
    <h3>🔐 Đăng Nhập Quyền Quản Trị</h3>
    <div class="form-group">
        <label>Nhập mật khẩu Admin (mặc định: admin123):</label>
        <input type="password" id="adminPass" placeholder="Nhập mật khẩu...">
    </div>
    <button class="btn" onclick="checkLogin()">Xác Nhận</button>
</div>

<!-- KHUNG QUẢN TRỊ VÀ NHẬP LIỆU -->
<div id="adminPanel">
    <div class="card" style="border: 2px dashed #b08d79;">
        <h3>🛠️ Thêm Trường Đại Học Mới Lên Mây</h3>
        
        <div class="form-group"><label>Tên Trường Đại Học:</label><input type="text" id="inputName" value="Đại học Quốc gia Thành phố Hồ Chí Minh"></div>
        <div class="form-group"><label>Link Ảnh Logo Trường (URL):</label><input type="text" id="inputLogo" value="https://upload.wikimedia.org/wikipedia/vi/f/fb/VNUHCM_logo.svg"></div>
        <div class="form-group"><label>Mô tả ngắn về trường:</label><textarea id="inputDesc" rows="2">Là một trong hai Đại học Quốc gia ở Việt Nam.</textarea></div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>1. Độ phủ Tổng quát (20):</label><input type="number" id="scorePTQ" value="18" step="0.1"></div>
            <div class="form-group" style="flex: 1;"><label>2. Độ phủ Chi tiết (15):</label><input type="number" id="scorePCT" value="11.08" step="0.01"></div>
        </div>
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>3. Độ mở người học (15):</label><input type="number" id="scoreDMNH" value="1.96" step="0.01"></div>
            <div class="form-group" style="flex: 1;"><label>4. Mức độ thu hút (15):</label><input type="number" id="scoreMDTH" value="4.24" step="0.01"></div>
        </div>
        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex: 1;"><label>5. Mức liên kết (25):</label><input type="number" id="scoreMLK" value="22.3" step="0.01"></div>
            <div class="form-group" style="flex: 1;"><label>6. Điểm thi đua (15):</label><input type="number" id="scoreTD" value="11.4" step="0.01"></div>
            <div class="form-group" style="flex: 1;"><label>6. Điểm đánh giá tổng quát (15):</label><input type="number" id="scoreTD" value="11.4" step="0.01"></div>
        </div>

        <button class="btn" onclick="addNewUniversity()">💾 Lưu Lên Hệ Thống Mây</button>
    </div>

    <h2>🗑️ Danh Sách Trường Đã Đăng & Nút Xóa</h2>
    <div id="adminListContainer">Đang tải danh sách...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAxo2jhBAk4CfE99PmhHULoa5Rbq9ZKy0",
    authDomain: "vinuniranking.firebaseapp.com",
    projectId: "vinuniranking",
    storageBucket: "vinuniranking.firebasestorage.app",
    messagingSenderId: "514165857266",
    appId: "1:514165857266:web:2cb8ebf84fd6298443e96b",
    measurementId: "G-ZXNG885SR6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.checkLogin = function() {
      let pass = document.getElementById('adminPass').value;
      if(pass === "admin123") {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          loadAdminList();
      } else {
          alert("Sai mật khẩu rồi sếp ơi!");
      }
  }

  window.addNewUniversity = async function() {
      let name = document.getElementById('inputName').value;
      let logo = document.getElementById('inputLogo').value;
      let desc = document.getElementById('inputDesc').value;
      let ptq = parseFloat(document.getElementById('scorePTQ').value) || 0;
      let pct = parseFloat(document.getElementById('scorePCT').value) || 0;
      let dmnh = parseFloat(document.getElementById('scoreDMNH').value) || 0;
      let mdth = parseFloat(document.getElementById('scoreMDTH').value) || 0;
      let mlk = parseFloat(document.getElementById('scoreMLK').value) || 0;
      let td = parseFloat(document.getElementById('scoreTD').value) || 0;

      if(!name) { alert("Vui lòng nhập tên trường!"); return; }

      try {
          await addDoc(collection(db, "universities"), { name, logo, desc, ptq, pct, dmnh, mdth, mlk, td, createdAt: new Date() });
          alert("Thêm trường thành công!");
          loadAdminList();
      } catch (e) { alert("Lỗi: " + e.message); }
  }

  async function loadAdminList() {
      const container = document.getElementById('adminListContainer');
      container.innerHTML = "Đang tải danh sách trường...";
      try {
          const querySnapshot = await getDocs(collection(db, "universities"));
          if(querySnapshot.empty) { 
              container.innerHTML = "<p>Chưa có trường nào trên hệ thống.</p>"; 
              return; 
          }
          
          let html = "";
          querySnapshot.forEach((docItem) => {
              let d = docItem.data();
              if(!d.name) return;
              html += `
              <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                  <div>
                      <img src="${d.logo}" class="logo-me" onerror="this.src='https://via.placeholder.com/50?text=Logo'">
                      <strong>${d.name}</strong>
                  </div>
                  <button class="btn btn-danger" onclick="deleteUniversity('${docItem.id}')">🗑️ Xóa Trường Này</button>
              </div>`;
          });
          container.innerHTML = html;
      } catch (e) { 
          container.innerHTML = "Lỗi tải dữ liệu: " + e.message; 
      }
  }

  window.deleteUniversity = async function(id) {
      if(confirm("Sếp có chắc chắn muốn xóa trường này khỏi hệ thống mây không?")) {
          try {
              await deleteDoc(doc(db, "universities", id));
              alert("Đã xóa thành công!");
              loadAdminList();
          } catch(e) { 
              alert("Lỗi khi xóa: " + e.message); 
          }
      }
  }
</script>

</body>
</html>
