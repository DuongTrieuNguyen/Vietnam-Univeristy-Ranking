<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang Quản Trị - Thêm Trường Đại Học</title>
<style>
body { background-color: #fcf8f5; color: #4a3b32; font-family: Cambria; padding: 40px; max-width: 700px; margin: auto; }
.card { background-color: #f4ece6; padding: 25px; border-radius: 12px; border: 1px solid #e3d5cb; margin-bottom: 25px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #5c4033; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #e3d5cb; background-color: #fffcf9; font-family: Cambria; box-sizing: border-box; }
.btn { background-color: #6b4f3f; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: Cambria; }
.btn:hover { background-color: #553d31; }
/* Mặc định ẩn bảng quản trị đi, chỉ hiện khi nhập đúng pass */
#adminPanel { display: none; }
</style>
</head>
<body>

<!-- KHUNG NHẬP MẬT KHẨU BẢO MẬT -->
<div class="card" id="loginBox">
    <h3>🔐 Đăng Nhập Quyền Quản Trị</h3>
    <div class="form-group">
        <label>Nhập mật khẩu Admin:</label>
        <input type="password" id="adminPass" placeholder="Mật khẩu mặc định: admin123">
    </div>
    <button class="btn" onclick="checkLogin()">Xác Nhận</button>
</div>

<!-- KHUNG NHẬP LIỆU QUẢN TRỊ (BẨM ĐÚNG PASS MỚI HIỆN) -->
<div class="card" id="adminPanel">
    <h2>🛠️ Thêm Trường Đại Học Mới Lên Mây</h2>
    
    <div class="form-group">
        <label>Tên Trường Đại Học:</label>
        <input type="text" id="inputName" placeholder="VD: Đại học Quốc gia TP.HCM">
    </div>
    
    <div class="form-group">
        <label>Link Ảnh Logo Trường (URL):</label>
        <input type="text" id="inputLogo" value="https://upload.wikimedia.org/wikipedia/vi/f/fb/VNUHCM_logo.svg">
    </div>

    <div class="form-group">
        <label>Mô tả ngắn về trường:</label>
        <textarea id="inputDesc" rows="2">Mô tả ngắn gọn về trường...</textarea>
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;"><label>1. Độ phủ Tổng quát (Max 20):</label><input type="number" id="scorePTQ" value="18"></div>
        <div class="form-group" style="flex: 1;"><label>2. Độ phủ Chi tiết (Max 15):</label><input type="number" id="scorePCT" value="11.08"></div>
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;"><label>3. Độ mở với người học (Max 15):</label><input type="number" id="scoreDMNH" value="1.96"></div>
        <div class="form-group" style="flex: 1;"><label>4. Mức độ thu hút (Max 15):</label><input type="number" id="scoreMDTH" value="4.24"></div>
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;"><label>5. Mức liên kết (Max 25):</label><input type="number" id="scoreMLK" value="22.3"></div>
        <div class="form-group" style="flex: 1;"><label>6. Điểm thi đua (Max 15):</label><input type="number" id="scoreTD" value="11.4"></div>
    </div>

    <button class="btn" onclick="addNewUniversity()">💾 Lưu Lên Hệ Thống Mây</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAxo2jhBAk4CfE99PmhHULoa5Rbq9ZKy0",
    authDomain: "vinuniranking.firebaseapp.com",
    projectId: "vinuniranking",
    storageBucket: "vinuniranking.firebasestorage.app",
    messagingSenderId: "514165857266",
    appId: "1:514165857266:web:2cb8ebf84fd6298443e96b",
    measurementId: "G-ZXNG885SR6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Hàm kiểm tra mật khẩu
  window.checkLogin = function() {
      let pass = document.getElementById('adminPass').value;
      if(pass === "admin123") {
          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
      } else {
          alert("Sai mật khẩu rồi sếp ơi!");
      }
  }

  // Hàm thêm dữ liệu lên Firebase
  window.addNewUniversity = async function() {
      let name = document.getElementById('inputName').value;
      let logo = document.getElementById('inputLogo').value;
      let desc = document.getElementById('inputDesc').value;
      let ptq = parseFloat(document.getElementById('scorePTQ').value) || 0;
      let pct = parseFloat(document.getElementById('scorePCT').value) || 0;
      let dmnh = parseFloat(document.getElementById('scoreDMNH').value) || 0;
      let mdth = parseFloat(document.getElementById('scoreMDTH').value) || 0;
      let mlk = parseFloat(document.getElementById('scoreMLK').value) || 0;
      let td = parseFloat(document.getElementById('scoreTD').value) || 0;

      if(!name) {
          alert("Vui lòng nhập tên trường!");
          return;
      }

      try {
          await addDoc(collection(db, "universities"), {
              name: name, logo: logo, desc: desc,
              ptq: ptq, pct: pct, dmnh: dmnh,
              mdth: mdth, mlk: mlk, td: td,
              createdAt: new Date()
          });
          alert("Thêm trường thành công! Mở trang chủ xem kết quả ngay.");
          location.reload();
      } catch (e) {
          alert("Lỗi: " + e.message);
      }
  }
</script>

</body>
</html>
