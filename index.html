<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ thống Xếp hạng Đại học Việt Nam</title>
<style>
body { background-color: #fcf8f5; color: #4a3b32; font-family: Cambria; padding: 40px; max-width: 900px; margin: auto; }
.card { background-color: #f4ece6; padding: 25px; border-radius: 12px; border: 1px solid #e3d5cb; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
.logo-me { width: 180px; height: 130px; object-fit: contain; vertical-align: middle; margin-right: 15px; }
.badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; color: #ffffff; font-size: 0.9em; }
.badge-red { background-color: #d9534f; }
.badge-dark-yellow { background-color: #d97706; }
.badge-light-yellow { background-color: #ca8a04; }
.badge-light-green { background-color: #06b6d4; }
.badge-green { background-color: #22c55e; }
.badge-dark-green { background-color: #15803d; }
.progress-bar-bg { background-color: #e3d5cb; border-radius: 8px; height: 10px; width: 100%; margin-top: 5px; margin-bottom: 15px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 8px; }
.admin-link { float: right; font-size: 0.9em; color: #6b4f3f; text-decoration: none; border: 1px solid #6b4f3f; padding: 5px 10px; border-radius: 6px; }
.admin-link:hover { background-color: #6b4f3f; color: white; }
</style>
</head>
<body>

<a href="admin.html" class="admin-link">⚙️ Đăng nhập Quản trị</a>

<div class="card">
    <h2>Bảng Xếp Hạng và Đánh Giá Các Đại Học Ở Việt Nam</h2>
    <p>Dữ liệu đồng bộ trực tiếp từ hệ thống mây.</p>
</div>

<h1>Danh Sách Trường Đã Xếp Hạng</h1>
<div id="publicCardContainer">Đang tải dữ liệu từ mây...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAxo2jhBAk4CfE99PmhHULoa5Rbq9ZKy0",
    authDomain: "vinuniranking.firebaseapp.com",
    projectId: "vinuniranking",
    storageBucket: "vinuniranking.firebasestorage.app",
    messagingSenderId: "514165857266",
    appId: "1:514165857266:web:2cb8ebf84fd6298443e96b",
    measurementId: "G-ZXNG885SR6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function getColorClass(val, maxVal) {
      let p = (val / maxVal) * 100;
      if (p < 30) return 'badge-red';
      if (p < 45) return 'badge-dark-yellow';
      if (p < 60) return 'badge-light-yellow';
      if (p < 70) return 'badge-light-green';
      if (p < 80) return 'badge-green';
      return 'badge-dark-green';
  }

  async function loadUniversities() {
      const container = document.getElementById('publicCardContainer');
      container.innerHTML = "";
      try {
          const querySnapshot = await getDocs(collection(db, "universities"));
          if(querySnapshot.empty) {
              container.innerHTML = "<p>Chưa có trường nào trên hệ thống.</p>";
              return;
          }
          querySnapshot.forEach((doc) => {
              let d = doc.data();
              let total = Number(d.ptq) + Number(d.pct) + Number(d.dmnh) + Number(d.mdth) + Number(d.mlk) + Number(d.td);
              let totalColor = getColorClass(total, 100);

              let html = `
              <div class="card">
                  <img src="${d.logo}" class="logo-me" onerror="this.src='https://via.placeholder.com/180x130?text=Logo'">
                  <h2>${d.name}</h2>
                  <p>${d.desc}</p>
                  <hr style="border: 0; border-top: 1px solid #e3d5cb; margin: 15px 0;">
                  <h3>Điểm đánh giá tổng thể: <span class="badge ${totalColor}">~${total.toFixed(2)} điểm</span></h3>
                  <div class="progress-bar-bg"><div class="progress-bar-fill ${totalColor}" style="width: ${total}%;"></div></div>
                  <details>
                      <summary style="cursor: pointer; font-weight: bold; color: #6b4f3f;">Chi tiết từng phần điểm ▼</summary>
                      <div style="margin-top: 15px;">
                          <div><strong>1. Độ phủ Tổng quát:</strong> <span class="badge ${getColorClass(d.ptq, 20)}">${d.ptq} / 20 điểm</span></div>
                          <div><strong>2. Độ phủ Chi tiết:</strong> <span class="badge ${getColorClass(d.pct, 15)}">~${d.pct} / 15 điểm</span></div>
                          <div><strong>3. Độ mở với người học:</strong> <span class="badge ${getColorClass(d.dmnh, 15)}">~${d.dmnh} / 15 điểm</span></div>
                          <div><strong>4. Mức độ thu hút:</strong> <span class="badge ${getColorClass(d.mdth, 15)}">~${d.mdth} / 15 điểm</span></div>
                          <div><strong>5. Mức liên kết:</strong> <span class="badge ${getColorClass(d.mlk, 25)}">~${d.mlk} / 25 điểm</span></div>
                          <div><strong>6. Điểm thi đua:</strong> <span class="badge ${getColorClass(d.td, 15)}">~${d.td} / 15 điểm</span></div>
                      </div>
                  </details>
              </div>`;
              container.innerHTML += html;
          });
      } catch (e) {
          container.innerHTML = "<p>Lỗi tải dữ liệu: " + e.message + "</p>";
      }
  }
  loadUniversities();
</script>

</body>
</html>
